services:
  db:
    image: postgres:16-alpine
    container_name: agendai-db
    environment:
      POSTGRES_USER: agendai
      POSTGRES_PASSWORD: agendai
      POSTGRES_DB: agendai
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agendai"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
